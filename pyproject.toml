[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-lead-qualifier"
version = "0.1.0"
description = "A key-free, observable multi-agent workflow for qualifying inbound leads."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Wilber Ramos" }]
dependencies = []

[project.scripts]
lead-agent = "lead_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

